name: Build iOS

# 触发：手动 / 打 tag（v*）/ 每月1日自动重建
# 双模式：
#   1) build-unsigned —— 永远执行：产出未签名 IPA（Artifact 下载，用 Sideloadly 安装时签名）
#   2) build-signed   —— 配置了 Secrets 后自动执行：云端签名 + 传 TestFlight（无线自动更新）
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main']
  schedule:
    - cron: '0 3 1 * *'

jobs:
  # ============ 未签名 IPA（零配置可用） ============
  build-unsigned:
    runs-on: macos-15
    outputs:
      # GitHub 限制：job 级 if 不能直接用 secrets 上下文，先在本 job 检测再传给 build-signed
      secrets_ready: ${{ steps.check-secrets.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: check-secrets
        env:
          READY: ${{ secrets.ASC_KEY_ID != '' && secrets.TEAM_ID != '' }}
        run: echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          # 注意：xcodebuild 没有 -currentProjectVersion 选项（那是 agvtool 的），
          # 版本号用 build setting 覆盖形式传入；输出取尾部200行便于排错
          xcodebuild -project ScanGun.xcodeproj \
            -scheme ScanGun \
            -destination 'generic/platform=iOS' \
            -archivePath build/ScanGun.xcarchive \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tail -200

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/ScanGun.xcarchive/Products/Applications/ScanGun.app build/Payload/
          cd build && zip -qry ScanGun-unsigned.ipa Payload && cd ..
          ls -la build/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanGun-unsigned-ipa
          path: build/ScanGun-unsigned.ipa
          retention-days: 90

  # ============ 签名 + TestFlight（配置 Secrets 后自动启用） ============
  build-signed:
    # 未配置任一 Secret 时自动跳过（检测结果来自 build-unsigned 的输出）
    needs: build-unsigned
    if: needs.build-unsigned.outputs.secrets_ready == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Prepare App Store Connect API Key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project ScanGun.xcodeproj \
            -scheme ScanGun \
            -destination 'generic/platform=iOS' \
            -archivePath build/ScanGun.xcarchive \
            CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID ${ASC_KEY_ID} \
            -authenticationKeyIssuerID ${ASC_ISSUER_ID} \
            DEVELOPMENT_TEAM=${TEAM_ID} \
            archive 2>&1 | tail -200

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ScanGun.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID ${ASC_KEY_ID} \
            -authenticationKeyIssuerID ${ASC_ISSUER_ID} \
            DEVELOPMENT_TEAM=${TEAM_ID} \
            -quiet
          ls -la build/ipa/

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/ipa/ScanGun.ipa \
            -t ios \
            --apiKey ${ASC_KEY_ID} \
            --apiIssuer ${ASC_ISSUER_ID} \
            --verbose

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: signed-build-log
          path: build/
          if-no-files-found: ignore
